<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WhatOS Installer</title>
<style>
/*CSS*/
:root{--display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--body:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace}
html,body{height:100%}
body{margin:0;padding:0;overflow:hidden;user-select:none}
.app{max-width:none;height:100vh;border:0;border-radius:0;box-shadow:none;grid-template-rows:auto 1fr}
.title{padding:0 0 0 16px;height:40px}.wb{display:flex;margin-left:auto;align-self:stretch}.wb button{width:46px;border:0;background:transparent;color:var(--muted);cursor:default;display:grid;place-items:center}.wb button:hover{background:var(--panel);color:var(--ink)}.wb button.x:hover{background:#C42B1C;color:#fff}

.brand{display:flex;align-items:center;gap:9px;padding:0 10px 18px;font-family:var(--display);font-weight:600;font-size:16px}
.card[disabled]{opacity:.45;cursor:not-allowed}
.err{color:var(--danger)}
.fin{display:flex;gap:10px;flex-wrap:wrap}
</style></head><body>
<div class="app">
  <div class="title" id="title">/*LOGO*/<b>WhatOS</b><span>Installer</span><span class="wb"><button id="wmin" title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button><button class="x" id="wx" title="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button></span></div>
  <nav class="rail" id="rail"></nav>
  <div class="main"><div class="page" id="page"></div>
    <div class="foot"><span class="hint" id="hint"></span><button class="btn" id="back">Back</button><button class="btn pri" id="next">Next</button></div></div>
</div>
<script>
/*BI*/
const LOGO=`/*LOGO*/`;
const host={send:o=>window.chrome.webview.postMessage(o)};
const bic=(n,f)=>BI[n]?`<svg width="${f}" height="${f}" viewBox="0 0 24 24" aria-hidden="true"><path d="${BI[n]}" fill="#fff"/></svg>`:null;
const RAIL=["Windows","Method","Setup","Apps","Confirm","Install"];
const APPS=[
 {k:"browser",h:"Pick a browser",req:1,multi:0,o:[["Chrome","#1A73E8","Ch"],["Edge","#0C7BBF","Ed"],["Firefox","#E2601C","Fx"],["Brave","#E0452B","Br"],["Opera GX","#C3183C","GX"]]},
 {k:"zip",h:"Pick a zip tool",req:0,multi:0,note:"Skip to use the zip tool built into Windows.",o:[["7-Zip","#3B3B3B","7z"],["WinRAR","#6B3FA0","RAR"],["NanaZip","#2E7D6B","Nz"]]},
 {k:"games",h:"Game stores",req:0,multi:1,o:[["Steam","#1B2838","St"],["Epic","#2A2A2A","Ep"],["EA app","#E3343B","EA"],["Ubisoft","#0070FF","Ub"],["Battle.net","#148EFF","Bn"],["Xbox","#107C10","Xb"]]},
 {k:"chat",h:"Chat",req:0,multi:1,o:[["Discord","#5865F2","Dc"],["Telegram","#229ED9","Tg"],["WhatsApp","#25D366","Wa"],["LINE","#06C755","Li"]]},
 {k:"media",h:"Media",req:0,multi:1,o:[["VLC","#E85E00","VLC"],["Spotify","#1DB954","Sp"],["OBS","#302E31","OBS"]]},
 {k:"winapps",h:"Windows apps",req:0,multi:1,note:"All kept. Tap the ones you don't want.",o:[["Photos","#2B6CB0","Ph"],["Notepad","#4A5568","Np"],["Snipping Tool","#B83280","Sn"],["Terminal","#2D3748","Tm"],["Calculator","#4A5568","Ca"],["Paint","#2B6CB0","Pa"],["Camera","#2D3748","Cm"]]}
];
const M={tab:0,data:null,diff:null,busy:false,checking:false};
const S={p:0,win:null,iso:null,ed:null,method:null,def:null,xbox:null,store:null,mitig:"keep",apps:{},ok:false,info:null,run:null};
const initApps=()=>APPS.forEach(a=>S.apps[a.k]=new Set(a.k==="winapps"?a.o.map(o=>o[0]):[]));initApps();
const PAGES=["welcome","win","edition","method","target","defender",...APPS.map((_,i)=>"app"+i),"confirm","install"];
const railOf=p=>["welcome","win","edition"].includes(p)?0:["method","target"].includes(p)?1:p==="defender"?2:p.startsWith("app")?3:p==="confirm"?4:5;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GBf=b=>b>=1e12?(b/1e12).toFixed(1)+" TB":Math.round(b/1e9)+" GB";
const card=(id,ic,col,t,d,sel,dis)=>`<button class="card${sel?' sel':''}" data-id="${id}"${dis?' disabled':''}><span class="ic" style="background:${col}">${bic(t,20)||ic}</span><span class="t">${t}</span>${d?`<span class="d">${d}</span>`:''}</button>`;
const svgUsb='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="7" y="9" width="10" height="13" rx="2"/><path d="M9 9V3h6v6M10.5 5.5h0M13.5 5.5h0"/></svg>';
const svgDisk='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 14h18"/><circle cx="17" cy="16.5" r=".8" fill="#fff"/></svg>';
const svgIso='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>';
const steps=()=>{const u=S.method==="usb",m=u?"Make USB stick":"Make installer space";return S.win==="whatos"?["Check",m,"Download Windows","Build installer","Add WhatOS"]:["Check",m,"Copy Windows","Add WhatOS"]};
const usbOf=n=>S.info&&S.info.usbs?S.info.usbs.find(u=>u.n===n):null;
const need=()=>S.win==="whatos"?6.3e9:S.iso?S.iso.size+1073741824:9e9;

function canNext(){
  const p=PAGES[S.p];
  if(p==="win")return S.win==="whatos"||(S.win==="iso"&&!!S.iso); if(p==="edition")return !!S.ed; if(p==="method")return !!S.method;
  if(p==="target"){if(S.method==="usb")return S.usb!=null&&!!usbOf(S.usb)&&usbOf(S.usb).size>need()+2.7e9;return !!S.info&&S.info.uefi===S.info.gpt&&(S.info.cSize-S.info.cMin)>need()+2147483648}
  if(p==="defender")return !!(S.def&&S.xbox&&S.store);
  if(p.startsWith("app")){const a=APPS[+p.slice(3)];return !a.req||S.apps[a.k].size>0}
  if(p==="confirm")return S.ok; return true;
}

const MR=["Tweaks","Updates","History","Reinstall"];
function mcall(action,id){M.busy=true;renderManage();host.send({cmd:"manage",action,id:id||""})}
function renderManage(){
  $("#rail").innerHTML=MR.map((n,i)=>`<div class="rs ${i===M.tab?'on':''}" data-t="${i}" style="cursor:default"><span class="n">${i+1}</span><span class="l">${n}</span></div>`).join("");
  $("#rail").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{M.tab=+b.dataset.t;if(M.tab===1&&!M.diff&&!M.checking){M.checking=true;host.send({cmd:"updcheck"})}renderManage()});
  $("#back").hidden=true;$("#next").hidden=true;$("#hint").textContent=M.busy?"Working…":"";
  const P=$("#page"),d=M.data;
  if(!d){P.innerHTML=`<h1>WhatOS</h1><p class="sub">Reading this PC…</p>`;return}
  const badge=st=>st==="on"?'<span class="mono" style="color:var(--ok)">On</span>':st==="yours"?'<span class="mono" style="color:var(--warn)">Changed by you</span>':st==="mixed"?'<span class="mono" style="color:var(--warn)">Partly on</span>':st==="n/a"?'<span class="mono">Not on this PC</span>':'<span class="mono">Off</span>';
  if(M.tab===0){
    const cats=[...new Set(d.groups.map(g=>g.cat))];
    P.innerHTML=`<h1>Your tweaks</h1><p class="sub">Turn any of them off or back on. Changes apply right away; some need a restart.</p><div class="krs" style="overflow:auto">${cats.map(c=>`<small class="mono" style="margin-top:6px">${esc(c)}</small>`+d.groups.filter(g=>g.cat===c).map(g=>`<div class="kr"><span class="kt">${esc(g.name)} ${badge(g.state)}<small>${esc(g.desc)}</small></span><span class="seg"><button class="${g.state==="on"?"on":""}" data-a="apply:${g.id}" ${M.busy||g.state==="n/a"?"disabled":""}>On</button><button class="${g.state==="off"?"on rm":""}" data-a="revert:${g.id}" ${M.busy||g.state==="n/a"?"disabled":""}>Off</button></span></div>`).join("")).join("")}</div>`;
  }
  if(M.tab===1){
    const x=M.diff;
    P.innerHTML=`<h1>Updates</h1>`+(!x?`<p class="sub">Checking GitHub for new tweaks…</p>`:x.err?`<p class="sub err">${esc(x.err)}</p><button class="btn" id="rechk" style="align-self:flex-start">Try again</button>`:!x.changes.length?`<p class="sub">You're up to date (tweak set v${x.version}).</p><button class="btn" id="rechk" style="align-self:flex-start">Check again</button>`:`<p class="sub">Tweak set v${x.version} is out. Tweaks you turned off or changed stay as they are.</p><div class="krs">${x.changes.map(c=>`<div class="kr"><span class="kt">${esc(c.name)} <span class="mono">${c.new?"New":"Improved"}</span><small>${esc(c.desc)}</small></span></div>`).join("")}</div><button class="btn pri" id="updgo" style="align-self:flex-start" ${M.busy?"disabled":""}>Update</button>`);
    const r=$("#rechk");if(r)r.onclick=()=>{M.diff=null;M.checking=true;host.send({cmd:"updcheck"});renderManage()};
    const u=$("#updgo");if(u)u.onclick=()=>{M.busy=true;host.send({cmd:"updapply"});renderManage()};
  }
  if(M.tab===2){
    P.innerHTML=`<h1>History</h1>`+(d.history.length?`<div class="krs">${d.history.map(h=>`<div class="kr"><span class="kt">${esc(h.name)} <span class="mono">${h.a==="on"?"turned on":h.a==="off"?"turned off":h.a==="update"?"updated":"restored"}</span><small>${esc(h.t)}</small></span></div>`).join("")}</div><button class="btn" id="undo" style="align-self:flex-start" ${M.busy?"disabled":""}>Undo last change</button>`:`<p class="sub">Nothing changed yet.</p>`);
    const u=$("#undo");if(u)u.onclick=()=>mcall("undo");
  }
  if(M.tab===3){
    P.innerHTML=`<h1>Reinstall or make a USB</h1><p class="sub">Starts the installer: fresh WhatOS on this PC, or a USB stick for another PC.</p><button class="btn pri" id="toinst" style="align-self:flex-start">Open installer</button><h1 style="margin-top:28px">Remove WhatOS</h1><p class="sub">Turns every tweak back to the Windows default and removes this app. Apps you installed stay.</p><button class="btn" id="unin" style="align-self:flex-start;color:var(--danger)" ${M.busy?"disabled":""}>Restore Windows defaults and remove</button>`;
    $("#toinst").onclick=()=>{S.mode="install";S.p=0;render()};
    $("#unin").onclick=()=>{if(confirm("Turn all WhatOS tweaks back to Windows defaults and remove the WhatOS app?")){M.busy=true;host.send({cmd:"uninstall"});renderManage()}};
  }
  P.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const [a,id]=b.dataset.a.split(":");mcall(a,id)});
}
function render(){
  if(S.mode==="manage")return renderManage();
  const p=PAGES[S.p],r=railOf(p);
  $("#rail").innerHTML=RAIL.map((n,i)=>`<div class="rs ${i===r?'on':i<r?'done':''}"><span class="n">${i<r?'✓':i+1}</span><span class="l">${n}</span></div>`).join("");
  const P=$("#page");$("#hint").textContent="";$("#back").hidden=p==="welcome"||p==="install";$("#next").hidden=p==="install";
  $("#next").textContent=p==="welcome"?"Get started":p==="confirm"?"Prepare":"Next";
  if(p==="welcome")P.innerHTML=`<div class="hero">${LOGO.replace('width="18" height="18"','width="64" height="64"')}<h1>Fresh Windows.<br>Only what you pick.</h1><p class="sub" style="margin:0">With or without a USB stick.</p>${S.last?'<button class="btn" id="uselast" style="align-self:flex-start">Use my last picks</button>':''}</div>`;
  if(p==="win"){const nm=S.iso?esc(S.iso.name)+" · "+GBf(S.iso.size):"Pick a Windows ISO";
    P.innerHTML=`<h1>Which Windows?</h1><div class="big">${card("whatos","W","linear-gradient(135deg,#4C8DFF,#8A5CFF)","WhatOS","Recommended · downloads Windows 11 from Microsoft",S.win==="whatos")}${card("iso",svgIso,"#3A4658","My own ISO",S.win==="iso"?nm+" · installs as-is":"Browse… · installs as-is",S.win==="iso")}</div>`;
    if(S.win==="iso"&&!S.iso)$("#hint").textContent="Pick an ISO file";}
  if(p==="edition"){const e=S.info?S.info.edition:"…";P.innerHTML=`<h1>Which edition?</h1><p class="sub">Same speed. Auto keeps your license working.</p><div class="big">${card("auto","A","#2D6CDF","Auto","Matches this PC's license · "+e,S.ed==="auto")}${card("home","H","#3A4658","Home","",S.ed==="home")}${card("pro","P","#3A4658","Pro","Adds Remote Desktop, Hyper-V",S.ed==="pro")}</div>`;}
  if(p==="method")P.innerHTML=`<h1>How to install?</h1><div class="big">${card("usb",svgUsb,"#2D6CDF","USB stick","8 GB or more · works on any PC",S.method==="usb")}${card("disk",svgDisk,"#7A4CE0","No USB","Uses space on this PC",S.method==="disk")}</div>`;
  if(p==="target"&&S.method==="usb"){const U=S.info&&S.info.usbs?S.info.usbs:[];
    P.innerHTML=`<h1>Pick your USB</h1>${U.length?`<div class="big">${U.map(u=>card("u"+u.n,svgUsb,"#2D6CDF",esc(u.name),(u.letters?esc(u.letters)+" · ":"")+GBf(u.size)+(u.size<need()+2.7e9?" · too small":""),S.usb===u.n,u.size<need()+2.7e9)).join("")}</div><div class="warnbox">Everything on the USB stick is erased.</div>`:'<p class="sub" style="margin:0">No USB stick found. Plug one in (8 GB or more).</p>'}<button class="btn" id="rescan" style="align-self:flex-start">Look again</button>`;
    $("#rescan").onclick=()=>{S.info=null;host.send({cmd:"info"});render()};}
  else if(p==="target"){const I=S.info;
    if(!I){P.innerHTML=`<h1>Checking this PC…</h1>`;}
    else{const n=need(),cUsed=I.cSize-I.cFree,free=I.cFree-n,tot=I.cSize;
      const bad=I.uefi!==I.gpt?(I.uefi?"The Windows disk is not GPT. Use a USB stick instead.":"This PC starts in legacy BIOS mode but the Windows disk is not MBR. Use a USB stick instead."):(I.cSize-I.cMin)<n+2147483648?"Not enough free space on C:. WhatOS needs "+GBf(n+2147483648)+" free.":"";
      P.innerHTML=`<h1>We'll borrow ${GBf(n)}</h1><p class="sub">Works exactly like a USB. Given back after install.</p>
       <div class="drive">${svgDisk}<span>${esc(I.disk)} · ${GBf(I.diskSize)}</span></div>
       <div class="bar"><span style="flex:${cUsed/tot*100};background:#2A3A52">C: ${GBf(cUsed)} used</span><span style="flex:${n/tot*100};background:#7A4CE0;color:#fff;min-width:80px">Installer ${GBf(n)}</span><span style="flex:${Math.max(free,0)/tot*100};background:#1D2633;color:var(--muted)">free</span></div>
       <div class="legend"><span><i style="background:#2A3A52"></i>Windows</span><span><i style="background:#7A4CE0"></i>Temporary installer</span><span><i style="background:#1D2633"></i>Free</span></div>
       ${I.bitlocker?'<div class="warnbox">BitLocker is on for C:. That is fine, C: is replaced anyway.</div>':''}${bad?`<div class="warnbox">${bad}</div>`:''}`;}}
  if(p==="defender"){const q=(k,ic,col,t,d)=>`<div class="kr"><span class="ic sm" style="background:${col}">${ic}</span><span class="kt">${t}<small>${d}</small></span><span class="seg"><button class="${S[k]==="keep"?"on":""}" data-k="${k}:keep">Keep</button><button class="${S[k]==="remove"?"on rm":""}" data-k="${k}:remove">Remove</button></span></div>`;
    P.innerHTML=`<h1>Keep or remove?</h1><div class="krs">${q("def",'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg>',"#2F855A","Defender","Antivirus")}${q("xbox",'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M7 8h10a4 4 0 0 1 4 4v1.5a3 3 0 0 1-5.3 1.9L14.5 14h-5l-1.2 1.4A3 3 0 0 1 3 13.5V12a4 4 0 0 1 4-4z"/><path d="M8 10.5v3M6.5 12h3"/></svg>',"#107C10","Xbox","App, Game Bar, Game Pass")}${q("store",'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h16l-1.2 11a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',"#3182CE","Store","Store apps")}${q("mitig",'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>',"#6B46C1","CPU security patches","Expert · removing gives about 3-7% more FPS")}</div>${S.def==="remove"?'<p class="mono" style="margin:0;color:var(--warn)">No antivirus. Only open files you trust.</p>':''}${S.mitig==="remove"?'<p class="mono" style="margin:0;color:var(--warn)">Spectre/Meltdown patches off. Only for gaming PCs you trust.</p>':''}`;
    P.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.k.split(":");S[k]=v;render()});
    if(!canNext())$("#hint").textContent="Pick all three";}
  if(p.startsWith("app")){const i=+p.slice(3),a=APPS[i],sel=S.apps[a.k];
    P.innerHTML=`<span class="pill ${a.req?'req':''}">${a.req?'Required':'Optional'} · ${i+1}/${APPS.length}</span><h1>${a.h}</h1>${a.note?`<p class="sub">${a.note}</p>`:a.multi?'<p class="sub">Pick any.</p>':''}<div class="grid">${a.o.map(([n,c,ic])=>card(n,ic,c,n,"",sel.has(n))).join("")}</div>`;
    if(a.req&&!sel.size)$("#hint").textContent="Pick one to continue";}
  if(p==="confirm"){const apps=APPS.flatMap(a=>[...S.apps[a.k]]),w=S.win==="whatos";
    P.innerHTML=`<h1>Ready</h1><div class="sum"><div><small>Windows</small>${w?"WhatOS · Windows 11 from Microsoft":"My own ISO · "+esc(S.iso.name)}</div>${w?`<div><small>Edition</small>${{auto:"Auto ("+S.info.edition+")",home:"Home",pro:"Pro"}[S.ed]}</div><div><small>Defender · Xbox · Store</small>${[S.def,S.xbox,S.store].map(v=>v==="keep"?"Keep":"Remove").join(" · ")}</div>`:''}<div><small>Method</small>${S.method==="usb"?"USB stick · "+esc(usbOf(S.usb).name):"No USB ("+GBf(need())+" on C:)"}</div><div><small>Install on</small>${S.method==="usb"?"Pick after you boot the stick":"C: · replaces this Windows"}</div><div style="grid-column:1/-1"><small>Apps${w?" · "+apps.length:""}</small>${w?esc(apps.join(" · "))||"None":"Only with WhatOS"}</div></div>
    <div class="warnbox">${S.method==="usb"?"The USB stick is erased now. On the PC you boot it on, you choose the drive before anything is erased.":"After restart everything on C: is erased. Other drives are kept."} Name, password and Wi-Fi are set on the normal Windows screens.</div><label class="chk"><input type="checkbox" id="ok" ${S.ok?'checked':''}>I backed up my files</label>`;
    $("#ok").onchange=e=>{S.ok=e.target.checked;$("#next").disabled=!canNext()};}
  if(p==="install"){
    P.innerHTML=`<h1 id="ph">Preparing…</h1><p class="sub mono" id="pt">${S.method==="usb"?"Only the USB stick is changed.":"Nothing is erased until you restart."}</p><div class="prog">${steps().map((s,i)=>`<div class="ps" data-i="${i}"><span class="s">${i+1}</span><span>${s}</span><span class="mono pc"></span><span class="b"><i></i></span></div>`).join("")}</div><div class="fin" id="fin"></div>`;
    if(!S.run){S.run=1;host.send({cmd:"prepare",picks:{win:S.win,usb:S.usb,iso:S.win==="iso"?S.iso.path:null,ed:S.ed,method:S.method,def:S.def,xbox:S.xbox,store:S.store,mitig:S.mitig,apps:Object.fromEntries(APPS.map(a=>[a.k,[...S.apps[a.k]]]))}})}}
  if(p==="welcome"&&S.last)$("#uselast").onclick=()=>{const L=S.last;S.win=L.win==="iso"?null:L.win;S.ed=L.ed;S.def=L.def;S.xbox=L.xbox;S.store=L.store;S.mitig=L.mitig||"keep";
    APPS.forEach(a=>{S.apps[a.k]=new Set((L.apps&&L.apps[a.k])||[])});S.p=PAGES.indexOf(S.win?"method":"win");render()};
  P.style.zoom=1;if(P.scrollHeight>P.clientHeight+1)P.style.zoom=Math.max(.6,(P.clientHeight/P.scrollHeight)*.98);
  P.querySelectorAll(".card").forEach(b=>b.onclick=()=>pick(p,b.dataset.id));
  $("#next").disabled=!canNext();
}
function pick(p,id){
  if(p==="win"){S.win=id;if(id==="iso")host.send({cmd:"browseIso"});else S.iso=null}
  if(p==="edition")S.ed=id; if(p==="method"){S.method=id;S.usb=null} if(p==="target"&&id[0]==="u")S.usb=+id.slice(1);
  if(p.startsWith("app")){const a=APPS[+p.slice(3)],s=S.apps[a.k];if(s.has(id))s.delete(id);else{if(!a.multi)s.clear();s.add(id)}}
  render();
}
function step(i,pct,msg){
  document.querySelectorAll(".ps").forEach((row,k)=>{row.classList.toggle("ok",k<i);row.classList.toggle("on",k===i);
    if(k<i){row.querySelector(".s").textContent="✓";row.querySelector(".b i").style.width="100%";row.querySelector(".pc").textContent=""}});
  const row=document.querySelector(`.ps[data-i="${i}"]`);if(!row)return;
  row.querySelector(".b i").style.width=pct+"%";row.querySelector(".pc").textContent=pct+"%";$("#pt").textContent=msg;
  if(+pct>=100){row.classList.remove("on");row.classList.add("ok");row.querySelector(".s").textContent="✓";row.querySelector(".pc").textContent=""}
}
function finished(){
  step(steps().length,0,"");$("#ph").textContent="Ready to install";
  $("#pt").textContent="Restart when you want. Until then this PC works as normal.";
  $("#fin").innerHTML='<button class="btn pri" id="go">Restart and install</button><button class="btn" id="later">Later</button><button class="btn" id="rm">Cancel and remove installer</button>';
  $("#go").onclick=()=>{host.send({cmd:"restart"});$("#pt").textContent="Restarting…"};
  $("#later").onclick=()=>host.send({cmd:"close"});
  $("#rm").onclick=()=>{$("#fin").innerHTML="";$("#ph").textContent="Removing installer…";$("#pt").textContent="";S.rm=1;host.send({cmd:"cancel"})};
}
function failed(msg){
  $("#ph").innerHTML='<span class="err">Stopped</span>';$("#pt").textContent=msg;
  $("#fin").innerHTML='<button class="btn" id="again">Start over</button>';
  $("#again").onclick=()=>{S.run=null;S.p=0;S.win=S.iso=S.method=S.ed=S.def=S.xbox=S.store=null;S.mitig="keep";S.ok=false;initApps();render()};
}
window.chrome.webview.addEventListener("message",e=>{const m=e.data;
  if(m.type==="last"){S.last=m.picks;if(PAGES[S.p]==="welcome")render()}
  if(m.type==="info"){S.info=m.info;if(m.info.whatos&&!S.mode){S.mode="manage";host.send({cmd:"manage",action:"status"})}render()}
  if(m.type==="manage"){M.busy=false;if(m.data)M.data=m.data;else if(m.err)alert(m.err);render()}
  if(m.type==="diff"){M.checking=false;M.diff=m.data||{err:m.err||"Could not check for updates."};render()}
  if(m.type==="updated"){M.busy=false;M.diff=null;M.data=m.data||M.data;M.tab=0;render()}
  if(m.type==="uninstalled"){M.busy=false;$("#page").innerHTML=`<h1>WhatOS removed</h1><p class="sub">Windows defaults are back. Restart your PC to finish.</p>`}
  if(m.type==="iso"){if(m.path)S.iso=m;render()}
  if(m.type==="ps"){const f=m.line.split("|");if(f[0]==="step")step(+f[1],+f[2],f.slice(3).join("|"));if(f[0]==="done"&&f[1]==="usb"){step(steps().length,0,"");$("#ph").textContent="USB stick ready";$("#pt").textContent="Plug it into any PC, start from it (boot menu key, often F12, F11 or Esc) and pick the drive.";$("#fin").innerHTML='<button class="btn pri" id="cl">Close</button>';$("#cl").onclick=()=>host.send({cmd:"close"})}else if(f[0]==="done"){if(S.rm){$("#ph").textContent="Installer removed";$("#pt").textContent="This PC is back to normal.";$("#fin").innerHTML='<button class="btn pri" id="cl">Close</button>';$("#cl").onclick=()=>host.send({cmd:"close"})}else if(f[1]!=="restart")finished()}if(f[0]==="error")failed(f.slice(1).join("|"))}
  if(m.type==="exit"&&m.code!==0&&!$("#again"))failed("Something went wrong. Log: %TEMP%\\WhatOS\\prepare.log");
  if(m.type==="error")failed(m.msg);
});
$("#next").onclick=()=>{if(canNext()){S.p++;while(skip(S.p))S.p++;render()}};
$("#back").onclick=()=>{S.p--;while(skip(S.p))S.p--;render()};
const skip=i=>S.win==="iso"&&(PAGES[i].startsWith("app")||["edition","defender"].includes(PAGES[i]));
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement===document.body&&!$("#next").disabled&&!$("#next").hidden)$("#next").click()});
window.addEventListener("resize",()=>{if(PAGES[S.p]!=="install")render()});
$("#title").addEventListener("mousedown",e=>{if(e.button===0&&!e.target.closest("button"))host.send({cmd:"drag"})});
$("#wmin").onclick=()=>host.send({cmd:"min"});$("#wx").onclick=()=>host.send({cmd:"close"});
host.send({cmd:"info"});
render();
</script></body></html>
