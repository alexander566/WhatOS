<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WhatOS Installer</title>
<style>
/*CSS*/
:root{--display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--body:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace}
html,body{height:100%}
body{margin:0;padding:0;overflow:hidden;user-select:none}
.app{max-width:none;height:100vh;border:0;border-radius:0;box-shadow:none;grid-template-rows:auto 1fr}
.title{padding:0 0 0 16px;height:40px}.gsel{font:inherit;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;align-self:center}.row .dot{align-self:center}.ver{font-size:12px;color:var(--muted);opacity:.8}#upd button{font:inherit;font-size:12px;padding:3px 10px;border-radius:6px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}#upd span{font-size:12px;color:var(--ok)}.wb{display:flex;margin-left:auto;align-self:stretch}.wb button{width:46px;border:0;background:transparent;color:var(--muted);cursor:default;display:grid;place-items:center}.wb button:hover{background:var(--panel);color:var(--ink)}.wb button.x:hover{background:#C42B1C;color:#fff}

.brand{display:flex;align-items:center;gap:9px;padding:0 10px 18px;font-family:var(--display);font-weight:600;font-size:16px}
.card[disabled]{opacity:.45;cursor:not-allowed}
.err{color:var(--danger)}
.fin{display:flex;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}
.tw .sub{margin:0;line-height:1.45}.tw h1{line-height:1.25;margin:0}.tw div>h1+.sub{margin-top:4px}.tw>h1+.sub{margin-top:-10px}
.shell{display:grid;grid-template-columns:216px 1fr;grid-template-rows:40px 1fr;height:100vh;background:var(--win)}
.shell .title{grid-column:1/-1;border-bottom:1px solid var(--line)}
.q{display:flex;align-items:center;gap:8px;height:28px;width:min(360px,40%);margin:0 auto;padding:0 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.q input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:13px}
.side{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nv{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:#B7C1CF;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.nv i{width:8px;height:8px;border-radius:3px;background:#3A4558}.nv.on{background:#1B2C47;color:#fff;font-weight:600}.nv.on i{background:var(--accent)}.nv:hover:not(.on){background:#151D28}
.mainw{min-width:0;min-height:0;display:flex}
.tw{flex:1;overflow:auto;padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.inst{flex:1;display:grid;grid-template-columns:190px 1fr;min-width:0;min-height:0}
.tw>*{flex-shrink:0}.tw h1{font-size:22px}.tw h2{font-family:var(--display);font-size:15px;margin:6px 0 0}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.box{padding:16px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.lab{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.4px}.big{font-family:var(--display);font-size:24px;font-weight:700}
.bar{height:6px;border-radius:3px;background:#222C3A;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.kv{display:flex;justify-content:space-between;gap:12px}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right}
.list{display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:16px;padding:13px 18px;background:var(--panel);border-bottom:1px solid #1C2430}.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.row .t b{font-weight:600}.row .t small{color:var(--muted);font-size:13px}
.dot{width:10px;height:10px;border-radius:5px;flex:0 0 auto}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:8px}.tag.Safe{background:#1B3A2A;color:#6FD39B}.tag.Advanced{background:#3A2E16;color:#F2B84B}.tag.Expert{background:#3A1C1C;color:#FF8A80}
.sw{width:46px;height:26px;flex:0 0 auto;border-radius:13px;border:0;padding:3px;display:flex;cursor:pointer;background:#2A3443;justify-content:flex-start}.sw::after{content:"";width:20px;height:20px;border-radius:10px;background:#8A96A8}
.sw.on{background:var(--accent);justify-content:flex-end}.sw.on::after{background:#fff}.sw.mixed{background:#5A4A22}.sw:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--panel);color:#B7C1CF;font:inherit;font-weight:600;cursor:pointer}.chip.on{border-color:var(--accent);background:#1B2C47;color:#CFE0FF}
.st{font-size:12px;font-weight:600}.ok{color:var(--ok)}.wn{color:var(--warn)}
.kr .kt{flex:1 1 auto;min-width:0}.kr .seg{flex:0 0 auto;display:flex;width:auto}.kr .seg button{min-width:56px}
</style></head><body>
<div class="shell">
  <div class="title" id="title">/*LOGO*/<b>WhatOS</b><span>Tweaker</span><label class="q"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Search tweaks and settings" aria-label="Search tweaks and settings"></label><span class="wb"><button id="wmin" title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button><button id="wmax" title="Maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button><button class="x" id="wx" title="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button></span></div>
  <nav class="side" id="side"></nav>
  <div class="mainw">
    <div class="tw" id="tw"></div>
    <div class="inst" id="inst" hidden><nav class="rail" id="rail"></nav><div class="main"><div class="page" id="page"></div>
    <div class="foot"><span class="hint" id="hint"></span><button class="btn" id="back">Back</button><button class="btn pri" id="next">Next</button></div></div></div>
  </div>
</div>
<script>
/*BI*/
const LOGO=`/*LOGO*/`;
const host={send:o=>window.chrome.webview.postMessage(o)};
const bic=(n,f)=>BI[n]?`<svg width="${f}" height="${f}" viewBox="0 0 24 24" aria-hidden="true"><path d="${BI[n]}" fill="#fff"/></svg>`:null;
const RAIL=["Windows","Method","Setup","Apps","Confirm","Install"];
const APPS=[
 {k:"browser",h:"Pick a browser",req:1,multi:0,o:[["Chrome","#1A73E8","Ch"],["Edge","#0C7BBF","Ed"],["Firefox","#E2601C","Fx"],["Brave","#E0452B","Br"],["Opera GX","#C3183C","GX"]]},
 {k:"zip",h:"Pick a zip tool",req:0,multi:0,note:"Skip to use the zip tool built into Windows.",o:[["7-Zip","#3B3B3B","7z"],["WinRAR","#6B3FA0","RAR"],["NanaZip","#2E7D6B","Nz"]]},
 {k:"games",h:"Game stores",req:0,multi:1,o:[["Steam","#1B2838","St"],["Epic","#2A2A2A","Ep"],["EA app","#E3343B","EA"],["Ubisoft","#0070FF","Ub"],["Battle.net","#148EFF","Bn"],["Xbox","#107C10","Xb"]]},
 {k:"chat",h:"Chat",req:0,multi:1,o:[["Discord","#5865F2","Dc"],["Telegram","#229ED9","Tg"],["WhatsApp","#25D366","Wa"],["LINE","#06C755","Li"]]},
 {k:"media",h:"Media",req:0,multi:1,o:[["VLC","#E85E00","VLC"],["Spotify","#1DB954","Sp"],["OBS","#302E31","OBS"]]},
 {k:"winapps",h:"Windows apps",req:0,multi:1,note:"All kept. Tap the ones you don't want.",o:[["Photos","#2B6CB0","Ph"],["Notepad","#4A5568","Np"],["Snipping Tool","#B83280","Sn"],["Terminal","#2D3748","Tm"],["Calculator","#4A5568","Ca"],["Paint","#2B6CB0","Pa"],["Camera","#2D3748","Cm"]]}
];
const M={tab:0,data:null,diff:null,busy:false,checking:false};
const S={p:0,win:null,iso:null,ed:null,method:null,def:null,xbox:null,store:null,mitig:"keep",apps:{},ok:false,info:null,run:null};
const initApps=()=>APPS.forEach(a=>S.apps[a.k]=new Set(a.k==="winapps"?a.o.map(o=>o[0]):[]));initApps();
const PAGES=["welcome","win","edition","method","target","defender",...APPS.map((_,i)=>"app"+i),"confirm","install"];
const railOf=p=>["welcome","win","edition"].includes(p)?0:["method","target"].includes(p)?1:p==="defender"?2:p.startsWith("app")?3:p==="confirm"?4:5;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GBf=b=>b>=1e12?(b/1e12).toFixed(1)+" TB":Math.round(b/1e9)+" GB";
const card=(id,ic,col,t,d,sel,dis)=>`<button class="card${sel?' sel':''}" data-id="${id}"${dis?' disabled':''}><span class="ic" style="background:${col}">${bic(t,20)||ic}</span><span class="t">${t}</span>${d?`<span class="d">${d}</span>`:''}</button>`;
const svgUsb='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="7" y="9" width="10" height="13" rx="2"/><path d="M9 9V3h6v6M10.5 5.5h0M13.5 5.5h0"/></svg>';
const svgDisk='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 14h18"/><circle cx="17" cy="16.5" r=".8" fill="#fff"/></svg>';
const svgIso='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>';
const steps=()=>{const u=S.method==="usb",m=u?"Make USB stick":"Make installer space";return S.win==="whatos"?["Check",m,"Download Windows","Build installer","Add WhatOS"]:["Check",m,"Copy Windows","Add WhatOS"]};
const usbOf=n=>S.info&&S.info.usbs?S.info.usbs.find(u=>u.n===n):null;
const need=()=>S.win==="whatos"?6.3e9:S.iso?S.iso.size+1073741824:9e9;

function canNext(){
  const p=PAGES[S.p];
  if(p==="win")return S.win==="whatos"||(S.win==="iso"&&!!S.iso); if(p==="edition")return !!S.ed; if(p==="method")return !!S.method;
  if(p==="target"){if(S.method==="usb")return S.usb!=null&&!!usbOf(S.usb)&&usbOf(S.usb).size>need()+2.7e9;return !!S.info&&S.info.uefi===S.info.gpt&&(S.info.cSize-S.info.cMin)>need()+2147483648}
  if(p==="defender")return !!(S.def&&S.xbox&&S.store);
  if(p.startsWith("app")){const a=APPS[+p.slice(3)];return !a.req||S.apps[a.k].size>0}
  if(p==="confirm")return S.ok; return true;
}

const NAV=[["dash","Dashboard"],["game","Game Mode"],["tweaks","Tweaks"],["perf","Performance"],["install","Install Windows"],["backup","Backup & history"]];
const T={page:"dash",cat:"All",stats:null,sys:null,health:null,hb:false,q:""};
let statTimer=null,gmTimer=null;
function mcall(action,id){M.busy=true;renderTW();host.send({cmd:"manage",action,id:id||""})}
function go(pg){T.page=pg;T.q="";$("#q").value="";if(pg==="install"){S.mode="install";if(!S.info&&!S.infoAsked){S.infoAsked=1;host.send({cmd:"info"})}}renderTW()}
const sw=g=>`<button class="sw ${g.state==="on"?"on":g.state==="mixed"||g.state==="yours"?"mixed":""}" data-g="${g.id}" aria-label="${esc(g.name)}" ${M.busy||g.state==="n/a"?"disabled":""}></button>`;
const grow=g=>`<div class="row"><div class="t"><b>${esc(g.name)}${g.level?`<span class="tag ${g.level}">${g.level}</span>`:""}</b><small>${esc(g.desc)}${g.state==="yours"?" · changed by you":g.state==="n/a"?" · not on this PC":""}</small></div>${sw(g)}</div>`;
const fmtB=b=>b>=1099511627776?(b/1099511627776).toFixed(1)+" TB":b>=1073741824?(b/1073741824).toFixed(1)+" GB":Math.round(b/1048576)+" MB";
function paintStats(){const x=T.stats,set=(k,v,p,sub)=>{const b=document.querySelector(`#tw [data-k=${k}]`);if(!b)return;b.querySelector(".big").textContent=v;b.querySelector(".bar i").style.width=Math.max(0,Math.min(100,p))+"%";if(sub!=null)b.querySelector("small").textContent=sub};
  set("CPU",x.cpu+"%",x.cpu);set("GPU",x.gpu==null?"…":x.gpu+"%",x.gpu||0);const r=x.ramUsed/x.ramTotal*100;set("MEMORY",Math.round(r)+"%",r,fmtB(x.ramUsed)+" of "+fmtB(x.ramTotal)+" in use · "+x.procs+" processes");
  set("DISK",x.disk+"%",x.disk,"active time · C: "+fmtB(x.diskUsed)+" of "+fmtB(x.diskTotal)+" used");const u=$("#tw .sub");if(u&&T.sys)u.textContent=T.sys.host+" · up "+upt(x.uptime)}
const upt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${m} min`:`${m} min`};
function renderTW(){
  $("#side").innerHTML=NAV.map(([id,l])=>`<button class="nv ${T.page===id&&!T.q?"on":""}" data-nav="${id}"><i></i>${l}</button>`).join("");
  $("#side").querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));
  const inst=T.page==="install"&&!T.q;$("#inst").hidden=!inst;$("#tw").hidden=inst;
  if(inst){return render()}
  const P=$("#tw"),d=M.data,G=d?d.groups:[];
  if(T.page==="game"&&!T.q){if(!T.gm&&!T.gmAsked){T.gmAsked=1;host.send({cmd:"gm",act:"status"})}if(!gmTimer)gmTimer=setInterval(()=>{if(T.page==="game"&&!T.gmBusy&&!T.q)host.send({cmd:"gm",act:"status"})},3000)}
  if(T.page==="dash"&&!T.q){if(!statTimer){host.send({cmd:"stats"});statTimer=setInterval(()=>{if(T.page==="dash")host.send({cmd:"stats"})},2500)}}
  if(T.q){const q=T.q.toLowerCase(),r=G.filter(g=>(g.name+" "+g.desc+" "+g.cat).toLowerCase().includes(q));
    P.innerHTML=`<h1>Results for “${esc(T.q)}”</h1>`+(r.length?`<div class="list">${r.map(grow).join("")}</div>`:`<p class="sub">Nothing found. Try another word.</p>`)}
  else if(T.page==="dash"){const x=T.stats,y=T.sys,on=G.filter(g=>g.state==="on").length;
    const card=(k,v,p,sub)=>`<div class="box" data-k="${k}"><span class="lab">${k}</span><span class="big">${v}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div><small class="sub" style="font-size:12px">${sub}</small></div>`;
    const gp=y&&y.gpus&&y.gpus.length?y.gpus[0]:null;
    P.innerHTML=`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h1>Dashboard</h1><p class="sub">${y?esc(y.host):""}${x?" · up "+upt(x.uptime):""}</p></div><div style="display:flex;gap:8px"><button class="btn pri" id="cram">${T.ramBusy?"Clearing…":"Clear RAM"}</button></div></div>
    <div class="grid g4">${x?card("CPU",x.cpu+"%",x.cpu,y?esc(y.cpu):"")+card("GPU",x.gpu==null?"…":x.gpu+"%",x.gpu||0,gp?esc(gp.name):"")+card("MEMORY",Math.round(x.ramUsed/x.ramTotal*100)+"%",x.ramUsed/x.ramTotal*100,fmtB(x.ramUsed)+" of "+fmtB(x.ramTotal)+" in use · "+x.procs+" processes")+card("DISK",x.disk+"%",x.disk,"active time · C: "+fmtB(x.diskUsed)+" of "+fmtB(x.diskTotal)+" used"):`<div class="box"><span class="sub">Reading…</span></div>`}</div>
    <div class="grid g2"><div class="box"><b>This PC</b>${y?[["Windows",y.os+" "+(y.ver||"")+" ("+y.build+")"],["CPU",y.cpu+" · "+y.cores+" cores / "+y.threads+" threads"],...(y.gpus||[]).map(g=>["GPU",g.name+" · driver "+g.drv]),["RAM",y.ram+" GB"],["Disk",(y.disk||"")],["Firmware",(y.fw||"")+(y.secureBoot?" · Secure Boot on":"")+(y.tpm?" · TPM "+y.tpm:"")]].map(([k,v])=>`<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`).join(""):`<span class="sub">Reading…</span>`}</div>
    <div class="box"><b>WhatOS</b><div class="kv"><span>Tweaks on</span><span>${d?on+" of "+G.length:"…"}</span></div><div class="kv"><span>Tweak set</span><span>${d?"v"+d.manifest:"…"}</span></div></div></div>
    <div style="display:flex;align-items:center;justify-content:space-between"><h2>Health check</h2><button class="btn" id="hchk" ${T.hb?"disabled":""}>${T.hb?"Checking…":"Check again"}</button></div>
    <div class="list">${T.health?T.health.map(c=>`<div class="row"><span class="dot" style="background:${c.ok?"var(--ok)":"var(--warn)"}"></span><div class="t"><b>${esc(c.name)}</b><small>${esc(c.desc)}</small></div><span class="st ${c.ok?"ok":"wn"}">${esc(c.res)}</span>${c.fix==="restart"?`<button class="btn" data-fix="restart">Restart</button>`:""}</div>`).join(""):`<div class="row"><span class="sub">Checking…</span></div>`}</div>`;
    $("#cram").onclick=()=>{if(T.ramBusy)return;T.ramBusy=true;host.send({cmd:"clearram"});renderTW()};
    $("#hchk").onclick=()=>{T.hb=true;T.health=null;host.send({cmd:"health"});renderTW()};
    P.querySelectorAll("[data-fix=restart]").forEach(b=>b.onclick=()=>host.send({cmd:"reboot"}));
  }
  else if(T.page==="tweaks"||T.page==="perf"){const pg=T.page,list=G.filter(g=>g.page===pg),cats=[...new Set(list.map(g=>g.cat))];
    if(pg==="tweaks"&&!cats.includes(T.cat)&&T.cat!=="All")T.cat="All";
    P.innerHTML=`<h1>${pg==="tweaks"?"Tweaks":"Performance"}</h1><p class="sub">Changes apply right away. Some need a restart.</p>`+(!d?`<p class="sub">Reading this PC…</p>`:pg==="tweaks"?`<div class="chips">${["All",...cats].map(c=>`<button class="chip ${T.cat===c?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div class="list">${list.filter(g=>T.cat==="All"||g.cat===T.cat).map(grow).join("")}</div>`:cats.map(c=>`<h2>${esc(c)}</h2><div class="list">${list.filter(g=>g.cat===c).map(grow).join("")}</div>`).join(""));
    P.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{T.cat=b.dataset.c;renderTW()});
  }
  else if(T.page==="game"){const g=T.gm,c=g?g.cfg||{}:{},st=g&&g.state,ov=c.games||{},busy=T.gmBusy;
    const opt=(k,name,desc,def)=>`<div class="row"><div class="t"><b>${name}</b><small>${desc}</small></div><button class="sw ${(k==="priority"?(c.priority??"High")==="High":(c[k]??def))?"on":""}" data-gk="${k}" data-gd="${def?1:0}" ${busy?"disabled":""}></button></div>`;
    const mins=st&&st.since?Math.max(0,Math.round((Date.now()-Date.parse(st.since))/60000)):0;
    P.innerHTML=`<h1>Game Mode</h1><p class="sub">Boosts your game the moment it starts. Everything goes back when you quit.</p>`+(!g?`<p class="sub">Reading…</p>`:g.err?`<p class="sub err">${esc(g.err)}</p>`:!g.running?`<div class="box"><b>${g.installed?"Game Mode is not running":"Game Mode is off"}</b><span class="sub">Runs quietly in the background and uses almost no CPU or memory. You also get Game Mode on the desktop right-click menu.</span><button class="btn pri" id="gmin" style="align-self:flex-start" ${busy?"disabled":""}>${busy?"Turning on…":"Turn on Game Mode"}</button></div>`:
    `<div class="box" style="display:flex;flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap"><span class="dot" style="background:${st.on?"var(--ok)":"#5A6678"}"></span><div style="flex:1;min-width:200px"><b style="font-size:18px;display:block;line-height:1.35;margin-bottom:2px">${st.on?(st.manual&&!st.game||st.game==="Manual"?"On":"Playing "+esc(st.game)):"Waiting for a game"}</b><div class="sub" style="font-size:13px;line-height:1.4">${st.paused?"Paused until this game closes":st.on?`${mins} min · ${st.lowered} background apps slowed down`:c.auto??true?"Starts by itself when you open a game":"Auto start is off. Use the button or the desktop right-click menu"}</div></div><button class="btn ${st.on?"":"pri"}" id="gmnow" ${busy?"disabled":""}>${st.on?"Turn off now":"Turn on now"}</button></div>
    <h2>What it does</h2><div class="list">${opt("auto","Start by itself","Turns on when a game opens and off a few seconds after it closes",true)+opt("priority","Game gets CPU first","Your game runs at high priority so other programs can't slow it down",true)+opt("lowerApps","Slow down background apps","Discord, browsers, launchers and updaters get low priority while you play. They keep working",true)+opt("power","High performance power plan","Switches to High performance while you play, then back",true)+opt("clearRam","Free up RAM at start","Clears cached memory so the game gets more free RAM",true)}</div>

function pick(p,id){

function step(i,pct,msg){

  const row=document.querySelector(`.ps[data-i="${i}"]`);if(!row)return;
  row.querySelector(".b i").style.width=pct+"%";row.querySelector(".pc").textContent=pct+"%";$("#pt").textContent=msg;
  if(+pct>=100){row.classList.remove("on");row.classList.add("ok");row.querySelector(".s").textContent="✓";row.querySelector(".pc").textContent=""}
}

$("#next").onclick=()=>{if(canNext()){S.p++;while(skip(S.p))S.p++;render()}};
$("#back").onclick=()=>{S.p--;while(skip(S.p))S.p--;render()};
const skip=i=>S.win==="iso"&&(PAGES[i].startsWith("app")||["edition","defender"].includes(PAGES[i]));
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement===document.body&&!$("#next").disabled&&!$("#next").hidden)$("#next").click()});
window.addEventListener("resize",()=>{if(T.page==="install"&&PAGES[S.p]!=="install")render()});
$("#q").addEventListener("input",e=>{T.q=e.target.value.trim();renderTW()});
$("#title").addEventListener("mousedown",e=>{if(e.button===0&&!e.target.closest("button"))host.send({cmd:e.detail>1?"max":"drag"})});
$("#wmin").onclick=()=>host.send({cmd:"min"});$("#wmax").onclick=()=>host.send({cmd:"max"});$("#wx").onclick=()=>host.send({cmd:"close"});
host.send({cmd:"manage",action:"status"});host.send({cmd:"sysinfo"});host.send({cmd:"health"});setTimeout(()=>host.send({cmd:"selfupd"}),3000);
renderTW();
</script></body></html>
